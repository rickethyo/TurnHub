[env:atlas]
; Pinned (2026-10-02): the code targets Arduino-ESP32 2.0.17. An unpinned
; espressif32 can resolve to a locally installed pioarduino platform (Arduino
; core 3.x, mbedTLS 3), which does not build TurnHub.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
; Board-less build (atlas_board_none.cpp) on a generic 4 MB ESP32 until the
; atlas-s3 environment replaces it; the Gen 1 E32R28T build is on legacy/gen1.
; min_spiffs keeps two OTA app slots (1.9 MB each); Atlas uses no SPIFFS.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; No port is pinned: COM numbers change when the PC restarts. Pass
; --upload-port / --port.
upload_speed = 921600

; Embed the complete compressed admin portal in every Atlas firmware build.
extra_scripts = pre:tools/embed_web.py

build_flags =
    -I../shared/include
    -DCORE_DEBUG_LEVEL=1
    ; Per-request BEGIN/END tracing (constant routes, no request secrets). Off
    ; for release: with several phones polling it pushes older evidence out of
    ; the RAM and SD logs. Set to 1 for a bench capture; low-stack warnings
    ; stay on either way.
    -DTURNHUB_HTTP_TRACE=0
    ; Retired hardware: refuse every OTA package (firmware_package.h).
    -DTURNHUB_OTA_RETIRED=1
    ; Keep per-function .su reports next to objects for stack investigations.
    -fstack-usage

; The 4-inch ESP32-S3 Atlas (ES3C40P, hardware/ESP32_S3_REFRESH.md): the same
; firmware with its touchscreen (ST7796S + FT6336U through LovyanGFX, drawn
; with LVGL 9.3 and the simulator's generated fonts). No speaker, battery or
; RGB drivers yet. Discrete ESP32-S3R8: octal PSRAM, 16 MB flash (JEDEC
; 5E4018, read on the first board 2026-10-28), native USB-C only.
[env:atlas-s3]
extends = env:atlas
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    lovyan03/LovyanGFX@1.2.30
    lvgl/lvgl@9.3.0
; The LVGL fonts generated for the simulator (LVGL/tools/generate_*fonts.py).
build_src_filter = +<*> +<../../LVGL/assets/th_*.c>
build_flags =
    ${env:atlas.build_flags}
    -DTURNHUB_BOARD_ES3C40P=1
    -DBOARD_HAS_PSRAM
    ; Serial is the native USB port (no USB-UART bridge on this board).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL finds include/lv_conf.h; the font sources include "lvgl.h".
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude

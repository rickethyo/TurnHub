[platformio]
default_envs = atlas-s3

; One build per real Atlas board. The Gen 1 E32R28T Atlas build is on
; legacy/gen1.

; The 4-inch ESP32-S3 Atlas (ES3C40P, hardware/ESP32_S3_REFRESH.md): the same
; firmware with its touchscreen (ST7796S + FT6336U through LovyanGFX, drawn
; with LVGL 9.3 and the simulator's generated fonts). The battery is read on
; GPIO 9; no speaker or RGB drivers yet. Discrete ESP32-S3R8: octal PSRAM, 16 MB flash (JEDEC
; 5E4018, read on the first board 2026-10-28), native USB-C only.
[env:atlas-s3]
; Pinned (2026-10-02): the code targets Arduino-ESP32 2.0.17. An unpinned
; espressif32 can resolve to a locally installed pioarduino platform (Arduino
; core 3.x, mbedTLS 3), which does not build TurnHub.
platform = espressif32 @ 7.1.3
framework = arduino
monitor_speed = 115200
; No port is pinned: COM numbers change when the PC restarts. Pass
; --upload-port / --port.
upload_speed = 921600

; Embed the complete compressed admin portal in every Atlas firmware build.
extra_scripts = pre:tools/embed_web.py

board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; TinyUSB serial (ARDUINO_USB_MODE=0): reach the ROM loader by a 1200 baud
; touch, then wait for the loader's own port (sd_card.cpp).
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
lib_deps =
    lovyan03/LovyanGFX@1.2.30
    lvgl/lvgl@9.3.0
    ; The shared game rules (core/README.md), C++17.
    symlink://../core
; The LVGL fonts generated for the simulator (LVGL/tools/generate_*fonts.py).
build_src_filter = +<*> +<../../LVGL/assets/th_*.c>
; The shared core needs C++17; Arduino-ESP32 2.0.17's GCC 8.4 supports it.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I../shared/include
    -DCORE_DEBUG_LEVEL=1
    ; Per-request BEGIN/END tracing (constant routes, no request secrets). Off
    ; for release: with several phones polling it pushes older evidence out of
    ; the RAM and SD logs. Set to 1 for a bench capture; low-stack warnings
    ; stay on either way.
    -DTURNHUB_HTTP_TRACE=0
    ; Until S3 OTA lands, refuse every OTA package (firmware_package.h).
    -DTURNHUB_OTA_RETIRED=1
    ; Keep per-function .su reports next to objects for stack investigations.
    -fstack-usage
    -DTURNHUB_BOARD_ES3C40P=1
    -DBOARD_HAS_PSRAM
    ; Serial is the native USB port (no USB-UART bridge on this board), as
    ; TinyUSB's CDC (USB_MODE 0, not the USB Serial/JTAG peripheral) so the
    ; same port also carries the microSD as a USB drive (sd_card.cpp). Upload
    ; resets into the ROM loader with a 1200 baud touch (board_upload below),
    ; then flashes the loader's port; if firmware stops answering on USB, hold
    ; BOOT while tapping RESET to flash.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL finds include/lv_conf.h; the font sources include "lvgl.h".
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude

[env:atlas]
platform = espressif32
board = esp32dev
framework = arduino
; LCDwiki E32R28T: ESP32-32E N4 (4 MB flash, no PSRAM). min_spiffs keeps two
; OTA app slots (1.9 MB each) and NVS at its default offset; Atlas uses no SPIFFS.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; No port is pinned: COM numbers change when the PC restarts. Pass
; --upload-port / --port (Atlas uses a CH340 USB bridge; Sigils use CP210x).
upload_speed = 921600

lib_deps =
    lovyan03/LovyanGFX@1.2.30

build_flags =
    -I../shared/include
    -DCORE_DEBUG_LEVEL=1

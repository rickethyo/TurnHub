<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0E">
<meta name="color-scheme" content="dark light">
<title>TurnHub · Developer</title>
<script src="./theme-boot.js"></script>
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TurnHub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<!-- build:css portal.css -->
<link rel="stylesheet" href="../../../design/dist/tokens.css">
<link rel="stylesheet" href="portal.css">
<!-- /build:css -->
</head>
<body class="page">
<!-- build:sprite -->
<div class="shell">
<header class="appbar plain">
 <a class="brand" href="/portal"><span class="brand-mark" aria-hidden="true"></span><span><span class="brand-name">TurnHub</span><span class="brand-sub">Developer</span></span></a>
 <div class="appbar-end"><a class="btn small ghost" href="/stats">Player stats</a><a class="btn small ghost" href="/portal">Back to portal</a></div>
</header>
<main id="main" class="stack">
 <div class="actions"><button class="primary" onclick="downloadLog()"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg>Download serial log</button><button onclick="refresh()"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg>Refresh now</button><p id="logStatus" class="msg" role="status" aria-live="polite"></p></div>
 <section class="card"><div class="card-head"><div><h1 class="eyebrow">Activity monitor</h1><p class="small">Recent in-memory Atlas events. The feed clears when Atlas restarts and is never written to flash.</p></div></div><div id="activity" class="activity">Loading...</div></section>
 <div class="grid">
  <section class="card half"><div class="card-head"><h2 class="eyebrow">Status</h2></div><pre id="status" class="code">Loading...</pre></section>
  <section class="card half"><div class="card-head"><h2 class="eyebrow">Devices</h2></div><pre id="devices" class="code">Loading...</pre></section>
  <section class="card half"><div class="card-head"><h2 class="eyebrow">Seats</h2></div><pre id="seats" class="code">Loading...</pre></section>
  <section class="card half"><div class="card-head"><h2 class="eyebrow">Runtime diagnostics</h2></div><pre id="diagnostics" class="code">Loading...</pre></section>
 </div>
</main>
</div>
<script>const token=()=>localStorage.getItem('turnhubSessionToken')||'';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function fetchJson(id){const x=await fetch('/api/'+id,{cache:'no-store',headers:{'X-TurnHub-Token':token()}});return await x.json()}async function refresh(){try{const a=await fetchJson('diagnostics/activity');document.getElementById('activity').innerHTML=(a.events||[]).map(e=>`<div class="event"><span class="time">${Math.round(Number(e.ageMs||0)/100)/10}s ago</span><span class="kind">${esc(e.kind)}</span><span class="message">${esc(e.message)}</span></div>`).join('')||'<div class="event">Waiting for activity…</div>';for(const id of ['status','devices','seats','diagnostics']){try{document.getElementById(id).textContent=JSON.stringify(await fetchJson(id),null,2)}catch(_){document.getElementById(id).textContent='Disconnected'}}}catch(_){document.getElementById('activity').textContent='Disconnected'}}async function downloadLog(){const st=document.getElementById('logStatus');st.textContent='Preparing serial log…';try{const r=await fetch('/api/diagnostics/log',{cache:'no-store',headers:{'X-TurnHub-Token':token()}});if(!r.ok){let m='Could not download the serial log';try{m=(await r.json()).error||m}catch(_){}throw new Error(m)}const blob=await r.blob();const cd=r.headers.get('Content-Disposition')||'';const f=(cd.match(/filename="([^"]+)"/)||[])[1]||'turnhub-atlas.log';const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=f;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);st.textContent='Saved '+f+'. It holds recent output since this boot; RAM only, cleared on restart.'}catch(e){st.textContent=e.message}}refresh();setInterval(refresh,1000)</script>
</body>
</html>

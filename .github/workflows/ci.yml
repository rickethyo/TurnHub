name: TurnHub CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Atlas host suites (ASan and UBSan)
        run: bash Atlas/tests/host/run-linux.sh
      - name: Sigil host suites (ASan and UBSan)
        run: bash Sigil/tests/host/run-linux.sh
      - name: Audit authoritative adapters
        run: python3 Atlas/tests/host/audit_adapters.py
      - name: Validate generated responses and shared contracts
        run: python3 Atlas/tests/host/check_client_contract.py
      - name: Design tokens are current and pass contrast checks
        run: python3 design/build_tokens.py --check
      - name: Web portal pack builds
        run: python3 Atlas/web/build.py --check
      - name: Android manual asset matches the newest user manual
        run: python3 Android/tools/export_manual.py --check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Firmware packaging tool
        run: |
          python -m pip install --disable-pip-version-check cryptography==46.0.7
          python tools/firmware/test_thfw.py

  firmware:
    name: Firmware (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Atlas
            environment: atlas
            product: atlas
          - project: Sigil
            environment: sigil
            product: sigil-eink
          - project: Sigil
            environment: sigil-oled
            product: sigil-oled
          - project: Sigil
            environment: sigil-epd-bn
          - project: Sigil
            environment: sigil-spare
          - project: Sigil
            environment: sigil-wokwi
    env:
      PIO_PROJECT: ${{ matrix.project }}
      PIO_ENVIRONMENT: ${{ matrix.environment }}
      # OTA product name; empty for builds that are never packaged.
      THFW_PRODUCT: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: |
          python -m pip install --disable-pip-version-check platformio==6.2.0
          pio settings set enable_telemetry No
      - name: Build firmware
        run: pio run --project-dir "$PIO_PROJECT" --environment "$PIO_ENVIRONMENT"
      - name: Prepare firmware artifact and build identity
        run: |
          mkdir -p "$RUNNER_TEMP/firmware"
          cp "$PIO_PROJECT/.pio/build/$PIO_ENVIRONMENT/firmware.bin" "$RUNNER_TEMP/firmware/"
          cp "$PIO_PROJECT/.pio/build/$PIO_ENVIRONMENT/firmware.elf" "$RUNNER_TEMP/firmware/"
          if [ "$PIO_ENVIRONMENT" = atlas ]; then
            cp "$PIO_PROJECT/.pio/build/$PIO_ENVIRONMENT/firmware.map" "$RUNNER_TEMP/firmware/"
            # Preserve paths so same-named framework/project reports don't collide.
            (cd "$PIO_PROJECT/.pio/build/$PIO_ENVIRONMENT" && find . -name '*.su' -print0 |
              tar --null -T - -czf "$RUNNER_TEMP/firmware/stack-usage.tar.gz")
          fi
          {
            git rev-parse HEAD
            printf 'Project: %s\nEnvironment: %s\n' "$PIO_PROJECT" "$PIO_ENVIRONMENT"
            pio --version
            pio pkg list --project-dir "$PIO_PROJECT" --environment "$PIO_ENVIRONMENT"
          } > "$RUNNER_TEMP/firmware/build-info.txt"
      # Signed OTA package (FIRMWARE_UPDATES.md): every build must carry its
      # descriptor, and is signed when the repository's signing key secret is
      # available (not for pull requests from forks).
      - name: Check descriptor and sign OTA package
        if: matrix.product != ''
        env:
          TURNHUB_FIRMWARE_SIGNING_KEY: ${{ secrets.TURNHUB_FIRMWARE_SIGNING_KEY }}
        run: |
          python -m pip install --disable-pip-version-check cryptography==46.0.7
          bin="$RUNNER_TEMP/firmware/firmware.bin"
          python tools/firmware/thfw.py descriptor "$bin" --expect-product "$THFW_PRODUCT"
          if [ -z "$TURNHUB_FIRMWARE_SIGNING_KEY" ]; then
            echo "::notice::No signing key secret; the $THFW_PRODUCT build is unsigned."
            exit 0
          fi
          out="$RUNNER_TEMP/firmware/$THFW_PRODUCT.thfw"
          python tools/firmware/thfw.py package "$bin" --out "$out"             --expect-product "$THFW_PRODUCT" --build-id "$GITHUB_SHA"
          python tools/firmware/thfw.py verify "$out"
      - name: Upload firmware build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-${{ matrix.environment }}-${{ github.sha }}
          path: ${{ runner.temp }}/firmware/
          if-no-files-found: error
          retention-days: 7
      # Screen previews: the real display code rendered to PNGs on the runner,
      # with the Atlas art's incremental redraws checked against full redraws.
      - name: Render screen previews
        if: matrix.environment == 'atlas' || matrix.environment == 'sigil'
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          if [ "$PIO_ENVIRONMENT" = atlas ]; then
            bash Atlas/tests/host/render-atlas-screens.sh
            cp Atlas/tests/host/build/screens/*.png "$RUNNER_TEMP/screens/"
          else
            bash Sigil/tests/host/render-sigil-screens.sh
            cp Sigil/.pio/host-tests/screens/*.png "$RUNNER_TEMP/screens/"
          fi
      - name: Upload screen previews
        if: matrix.environment == 'atlas' || matrix.environment == 'sigil'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screens-${{ matrix.environment }}-${{ github.sha }}
          path: ${{ runner.temp }}/screens/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up the repository's Gradle JVM
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          # Any JDK 17+ runs the build (Android Studio uses its bundled JBR); 25 is the current LTS.
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            Android/**/*.gradle.kts
            Android/gradle/libs.versions.toml
            Android/gradle/wrapper/gradle-wrapper.properties
      - name: Accept Android SDK licenses
        # The hosted runner includes the SDK. Gradle installs the platform and
        # build tools required by this project's compileSdk/AGP configuration.
        run: |
          # yes exits with SIGPIPE once sdkmanager finishes; preserve sdkmanager's status.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Build debug APK and run JVM unit tests
        working-directory: Android
        run: bash gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest
      - name: Upload Android test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-test-reports-${{ github.sha }}
          path: |
            Android/app/build/reports/tests/testDebugUnitTest/
            Android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-debug-${{ github.sha }}
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

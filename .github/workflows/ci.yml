name: TurnHub CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run only the work their changed paths can affect
  # (CONTINUOUS_INTEGRATION.md, "What runs"). Pushes to master and manual runs
  # build everything, so master's Play upload and artifacts are unchanged.
  changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      atlas: ${{ steps.filter.outputs.atlas }}
      sigil: ${{ steps.filter.outputs.sigil }}
      android: ${{ steps.filter.outputs.android }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          # Kept so the classifier can fetch the base tip; this job runs only git.
          persist-credentials: true
          fetch-depth: 1
      - name: Classify changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          all() { for c in atlas sigil android tools; do echo "$c=true"; done >> "$GITHUB_OUTPUT"; }
          if [ "$EVENT" != pull_request ]; then
            echo "::notice::$EVENT run: building everything."
            all; exit 0
          fi
          # Compare against the base branch tip itself, not HEAD^1: when the
          # branch already contains the base (merged master into it), the merge
          # ref's first parent is the branch's own previous commit and the
          # classifier would miss the PR's real changes.
          if ! git fetch --quiet --depth=1 origin "$BASE_SHA" ||
             ! files=$(git diff --name-only "$BASE_SHA" HEAD); then
            echo "::warning::Could not list changed files; building everything."
            all; exit 0
          fi
          atlas=false sigil=false android=false tools=false
          while IFS= read -r f; do
            case "$f" in
              .github/*) atlas=true sigil=true android=true tools=true ;;
              shared/*) atlas=true sigil=true ;;
              Atlas/*) atlas=true ;;
              Sigil/*) sigil=true ;;
              # Shared fixtures feed the Atlas contract check and Android tests.
              protocol/*) atlas=true android=true ;;
              # Tokens generate Android resources (the portal pack check always runs).
              design/*) android=true ;;
              # The offline manual is generated from the docx; the always-run
              # manual asset check covers it, so it needs no Gradle build.
              Android/app/src/main/assets/manual.md) ;;
              Android/*) android=true ;;
              # Signing tool: its tests plus every packaged firmware build.
              tools/firmware/*|tools/ci-requirements.txt) tools=true atlas=true sigil=true ;;
            esac
          done <<< "$files"
          printf '%s\n' "$files" | sed 's/^/  /'
          printf 'atlas=%s\nsigil=%s\nandroid=%s\ntools=%s\n' "$atlas" "$sigil" "$android" "$tools" |
            tee -a "$GITHUB_OUTPUT"

  host-tests:
    name: Host tests and contracts
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ATLAS: ${{ needs.changes.outputs.atlas }}
      SIGIL: ${{ needs.changes.outputs.sigil }}
      TOOLS: ${{ needs.changes.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Atlas host suites (ASan and UBSan)
        if: env.ATLAS == 'true'
        run: bash Atlas/tests/host/run-linux.sh
      - name: Sigil host suites (ASan and UBSan)
        if: env.SIGIL == 'true'
        run: bash Sigil/tests/host/run-linux.sh
      - name: Audit authoritative adapters
        run: python3 Atlas/tests/host/audit_adapters.py
      - name: Persistent branch maintenance safety checks
        run: python3 tools/scripts/test_sync_agent_branches.py
      # Reads the responses the Atlas host suites generate.
      - name: Validate generated responses and shared contracts
        if: env.ATLAS == 'true'
        run: python3 Atlas/tests/host/check_client_contract.py
      - name: Design tokens are current and pass contrast checks
        run: python3 design/build_tokens.py --check
      - name: Web portal pack builds
        run: python3 Atlas/web/build.py --check
      - name: Android manual asset matches the newest user manual
        run: python3 Android/tools/export_manual.py --check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: env.TOOLS == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt
      - name: Firmware packaging tool
        if: env.TOOLS == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r tools/ci-requirements.txt
          python tools/firmware/test_thfw.py

  firmware:
    name: Firmware (${{ matrix.environment }})
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Atlas
            environment: atlas
            product: atlas
          - project: Sigil
            environment: sigil
            product: sigil-eink
          - project: Sigil
            environment: sigil-oled
            product: sigil-oled
          - project: Sigil
            environment: sigil-spare
    env:
      # Steps are skipped (not the job) when this project is unaffected, so
      # each matrix check still reports under its own name.
      BUILD: ${{ matrix.project == 'Atlas' && needs.changes.outputs.atlas || needs.changes.outputs.sigil }}
      PIO_PROJECT: ${{ matrix.project }}
      PIO_ENVIRONMENT: ${{ matrix.environment }}
      # OTA product name; empty for builds that are never packaged.
      THFW_PRODUCT: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.BUILD == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: env.BUILD == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt
      # Platform, toolchain and libraries (about a minute of downloads per job
      # uncached). Keyed by the project's platformio.ini, so a version change
      # downloads fresh; the build itself always starts clean.
      - name: Cache PlatformIO packages
        if: env.BUILD == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ${{ matrix.project }}/.pio/libdeps
          key: pio-6.2.0-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
      - name: Install PlatformIO
        if: env.BUILD == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r tools/ci-requirements.txt
          pio settings set enable_telemetry No
      - name: Build firmware
        if: env.BUILD == 'true'
        run: pio run --project-dir "$PIO_PROJECT" --environment "$PIO_ENVIRONMENT"
      - name: Prepare firmware artifact and build identity
        if: env.BUILD == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/firmware"
          cp "$PIO_PROJECT/.pio/build/$PIO_ENVIRONMENT/firmware.bin" "$RUNNER_TEMP/firmware/"
          cp "$PIO_PROJECT/.pio/build/$PIO_ENVIRONMENT/firmware.elf" "$RUNNER_TEMP/firmware/"
          if [ "$PIO_ENVIRONMENT" = atlas ]; then
            cp "$PIO_PROJECT/.pio/build/$PIO_ENVIRONMENT/firmware.map" "$RUNNER_TEMP/firmware/"
            # Preserve paths so same-named framework/project reports don't collide.
            (cd "$PIO_PROJECT/.pio/build/$PIO_ENVIRONMENT" && find . -name '*.su' -print0 |
              tar --null -T - -czf "$RUNNER_TEMP/firmware/stack-usage.tar.gz")
          fi
          {
            git rev-parse HEAD
            printf 'Project: %s\nEnvironment: %s\n' "$PIO_PROJECT" "$PIO_ENVIRONMENT"
            pio --version
            pio pkg list --project-dir "$PIO_PROJECT" --environment "$PIO_ENVIRONMENT"
          } > "$RUNNER_TEMP/firmware/build-info.txt"
      # Signed OTA package (FIRMWARE_UPDATES.md): every build must carry its
      # descriptor, and is signed when the repository's signing key secret is
      # available (not for pull requests from forks).
      - name: Check descriptor and sign OTA package
        if: env.BUILD == 'true' && (matrix.product != '')
        env:
          TURNHUB_FIRMWARE_SIGNING_KEY: ${{ secrets.TURNHUB_FIRMWARE_SIGNING_KEY }}
        run: |
          bin="$RUNNER_TEMP/firmware/firmware.bin"
          python tools/firmware/thfw.py descriptor "$bin" --expect-product "$THFW_PRODUCT"
          if [ -z "$TURNHUB_FIRMWARE_SIGNING_KEY" ]; then
            echo "::notice::No signing key secret; the $THFW_PRODUCT build is unsigned."
            exit 0
          fi
          out="$RUNNER_TEMP/firmware/$THFW_PRODUCT.thfw"
          python tools/firmware/thfw.py package "$bin" --out "$out"             --expect-product "$THFW_PRODUCT" --build-id "$GITHUB_SHA"
          python tools/firmware/thfw.py verify "$out"
      - name: Upload firmware build
        if: env.BUILD == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-${{ matrix.environment }}-${{ github.sha }}
          path: ${{ runner.temp }}/firmware/
          if-no-files-found: error
          retention-days: 7
      # Screen previews: the real display code rendered to PNGs on the runner,
      # with the Atlas art's incremental redraws checked against full redraws.
      - name: Render screen previews
        if: env.BUILD == 'true' && (matrix.environment == 'atlas' || matrix.environment == 'sigil')
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          if [ "$PIO_ENVIRONMENT" = atlas ]; then
            bash Atlas/tests/host/render-atlas-screens.sh
            cp Atlas/tests/host/build/screens/*.png "$RUNNER_TEMP/screens/"
          else
            bash Sigil/tests/host/render-sigil-screens.sh
            cp Sigil/.pio/host-tests/screens/*.png "$RUNNER_TEMP/screens/"
          fi
      - name: Upload screen previews
        if: env.BUILD == 'true' && (matrix.environment == 'atlas' || matrix.environment == 'sigil')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screens-${{ matrix.environment }}-${{ github.sha }}
          path: ${{ runner.temp }}/screens/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android build and unit tests
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD: ${{ needs.changes.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.BUILD == 'true'
        with:
          persist-credentials: false
      - name: Set up the repository's Gradle JVM
        if: env.BUILD == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          # Any JDK 17+ runs the build (Android Studio uses its bundled JBR); 25 is the current LTS.
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            Android/**/*.gradle.kts
            Android/gradle/libs.versions.toml
            Android/gradle/wrapper/gradle-wrapper.properties
      - name: Accept Android SDK licenses
        if: env.BUILD == 'true'
        # The hosted runner includes the SDK. Gradle installs the platform and
        # build tools required by this project's compileSdk/AGP configuration.
        run: |
          # yes exits with SIGPIPE once sdkmanager finishes; preserve sdkmanager's status.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      # Play upload key (CONTINUOUS_INTEGRATION.md, "Android release bundle").
      # Without the secrets (a fork's pull request) the bundle is unsigned.
      - name: Decode the Play upload key
        if: env.BUILD == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.TURNHUB_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::notice::No upload key secret; the release bundle is unsigned."
            exit 0
          fi
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "TURNHUB_UPLOAD_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      # AGP 9 only creates unit-test tasks for the tested build type (debug).
      # The run number is the versionCode, so every bundle is a new upload.
      - name: Run JVM unit tests and build the release bundle
        if: env.BUILD == 'true'
        working-directory: Android
        env:
          TURNHUB_UPLOAD_STORE_PASSWORD: ${{ secrets.TURNHUB_UPLOAD_STORE_PASSWORD }}
          TURNHUB_UPLOAD_KEY_ALIAS: ${{ secrets.TURNHUB_UPLOAD_KEY_ALIAS }}
          TURNHUB_UPLOAD_KEY_PASSWORD: ${{ secrets.TURNHUB_UPLOAD_KEY_PASSWORD }}
        run: >-
          bash gradlew --no-daemon --stacktrace
          -Pturnhub.versionCode=${{ github.run_number }}
          testDebugUnitTest bundleRelease
      - name: Upload Android test reports
        if: ${{ !cancelled() && env.BUILD == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-test-reports-${{ github.sha }}
          path: |
            Android/app/build/reports/tests/testDebugUnitTest/
            Android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload release bundle
        if: env.BUILD == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release-${{ github.run_number }}-${{ github.sha }}
          path: Android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      # Master builds go straight to Play's Internal testing track
      # (CONTINUOUS_INTEGRATION.md, "Publishing to Play"). Skipped on pull
      # requests and whenever the Play service account or upload key is absent.
      - name: Check Play publishing
        id: play
        if: env.BUILD == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/master')
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ] || [ -z "${TURNHUB_UPLOAD_KEYSTORE:-}" ]; then
            echo "::notice::No Play service account or upload key; not publishing to Play."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish to Play internal testing
        if: env.BUILD == 'true' && (steps.play.outputs.publish == 'true')
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.turnhub.android
          releaseFiles: Android/app/build/outputs/bundle/release/app-release.aab
          releaseName: CI build ${{ github.run_number }}
          tracks: internal
          status: completed
      - name: Remove the decoded upload key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload.jks"

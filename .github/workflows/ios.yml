name: TurnHub iOS

on:
  pull_request:
    branches: [master]
    paths:
      - 'iOS/**'
      - 'protocol/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [master]
    paths:
      - 'iOS/**'
      - 'protocol/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS core tests and simulator build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core tests against shared contract fixtures
        run: swift test --package-path iOS/Core
      - name: Unsigned iPhone and iPad simulator build
        run: |
          xcodebuild -project iOS/TurnHub.xcodeproj -scheme TurnHub \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iOS/build CODE_SIGNING_ALLOWED=NO build

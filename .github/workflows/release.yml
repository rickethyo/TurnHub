name: TurnHub firmware release

# Pushing a tag builds and signs .thfw OTA packages and publishes a GitHub
# Release with the packages and the release feed the Android app reads
# (Documentation/engineering/FIRMWARE_UPDATES.md, "Release feed"):
#   v0.9.0         Atlas, the web portal pack and both Sigils
#   atlas-v0.7.1   Atlas and the web portal pack only
#   sigil-v0.9.13  both Sigils only
# The app reads the feed of the *latest* release, so a one-product release
# carries the other products' packages and feed entries over unchanged from the
# previous latest release; the feed always lists every product.
# Needs the TURNHUB_FIRMWARE_SIGNING_KEY secret.

on:
  push:
    tags: ['v*', 'atlas-v*', 'sigil-v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TURNHUB_FIRMWARE_SIGNING_KEY: ${{ secrets.TURNHUB_FIRMWARE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install --disable-pip-version-check platformio==6.2.0 cryptography==46.0.7
          pio settings set enable_telemetry No
      - name: Require the signing key
        run: |
          if [ -z "$TURNHUB_FIRMWARE_SIGNING_KEY" ]; then
            echo "::error::TURNHUB_FIRMWARE_SIGNING_KEY is not set; cannot sign a release."
            exit 1
          fi
      - name: Build and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          case "$GITHUB_REF_NAME" in
            atlas-v*) scope=atlas ;;
            sigil-v*) scope=sigil ;;
            *)        scope=all ;;
          esac
          build() {  # project environment product
            pio run --project-dir "$1" --environment "$2"
            local tmp="$out/$3.thfw"
            python tools/firmware/thfw.py package "$1/.pio/build/$2/firmware.bin" \
              --out "$tmp" --expect-product "$3" --build-id "$GITHUB_SHA"
            python tools/firmware/thfw.py verify "$tmp"
            local version
            version=$(python tools/firmware/thfw.py info "$tmp" | python -c \
              'import json,sys; print(".".join(map(str, json.load(sys.stdin)["version"])))')
            mv "$tmp" "$out/$3-$version.thfw"
          }
          if [ "$scope" != sigil ]; then
            build Atlas atlas atlas
            # The web portal pack (WEB_PORTAL.md): in the feed as product
            # "portal", so the app can install it; older apps skip the product.
            python Atlas/web/build.py --out "$RUNNER_TEMP/portal.bin"
            python tools/firmware/thfw.py package "$RUNNER_TEMP/portal.bin" \
              --out "$out/portal.thfw" --expect-product portal --build-id "$GITHUB_SHA"
            python tools/firmware/thfw.py verify "$out/portal.thfw"
            mv "$out/portal.thfw" "$out/portal-$(cat Atlas/web/VERSION | tr -d '[:space:]').thfw"
          fi
          if [ "$scope" != atlas ]; then
            build Sigil sigil sigil-eink
            build Sigil sigil-oled sigil-oled
          fi
          if [ "$scope" != all ]; then
            # Carry the other products over from the previous latest release.
            if [ "$scope" = atlas ]; then keep='sigil-eink-* sigil-oled-*'; else keep='atlas-* portal-*'; fi
            prev="$RUNNER_TEMP/previous"
            mkdir -p "$prev"
            if ! gh release download --repo "$GITHUB_REPOSITORY" --dir "$prev" --pattern '*.thfw'; then
              echo "::error::No previous release to carry the other products over from; publish a plain vX.Y.Z release first."
              exit 1
            fi
            for pattern in $keep; do
              files=("$prev"/$pattern.thfw)
              if [ ! -e "${files[0]}" ]; then
                echo "::error::The previous release has no $pattern package to carry over."
                exit 1
              fi
              for f in "${files[@]}"; do
                python tools/firmware/thfw.py verify "$f"
                cp "$f" "$out/"
              done
            done
          fi
          ls -l "$out"
          python tools/firmware/thfw.py feed "$out"/*.thfw \
            --release "$(echo "$GITHUB_REF_NAME" | sed 's/^v//; s/-v/-/')" --out "$out/turnhub-firmware.json"
          cat "$out/turnhub-firmware.json"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" --title "TurnHub $GITHUB_REF_NAME" \
            --notes "Signed firmware packages for Atlas and both Sigils, and the web portal pack (an atlas- or sigil-tagged release rebuilds only that product; the others are carried over unchanged from the release before). Install firmware from the TurnHub app or the Atlas portal, and the portal pack from the TurnHub app or the Atlas /update page."

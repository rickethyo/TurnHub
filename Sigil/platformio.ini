[platformio]
default_envs = sigil

; Shared by every Sigil build; not an environment itself.
[sigil_base]
; Pinned (2026-10-02): the code targets Arduino-ESP32 2.0.17. An unpinned
; espressif32 can resolve to a locally installed pioarduino platform (Arduino
; core 3.x, mbedTLS 3), which does not build TurnHub.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    zinggjm/GxEPD2

build_src_filter = +<*> -<oled_display.cpp>

build_flags =
    -I../shared/include
    -DCORE_DEBUG_LEVEL=1

; Every Sigil has the same inputs and outputs on the same GPIOs: the analog
; thumbstick (VRX GPIO34, VRY GPIO35, SW GPIO32; power it from 3.3 V), the
; NeoPixel Jewel 7 status ring (Data Input GPIO26 via 330 ohm, PWR 5V), the
; buzzer (GPIO33) and Pair (the BOOT button). Only the display differs.

; E-ink Sigil: 2.13" e-paper.
[env:sigil]
extends = sigil_base
lib_deps =
    ${sigil_base.lib_deps}
    adafruit/Adafruit NeoPixel@1.15.5

; OLED Sigil: hardware profile (SH1106 128x64, software SPI, carrier EPD
; header pins) lives in include/oled_config.h. The thumbstick drives the menu
; list. No port is pinned (COM numbers change on restart): pass --upload-port.
[env:sigil-oled]
extends = sigil_base
lib_deps =
    adafruit/Adafruit SH110X@2.1.15
    adafruit/Adafruit NeoPixel@1.15.5
build_src_filter = +<*> -<epaper_display.cpp>
build_flags =
    ${sigil_base.build_flags}
    -DTURNHUB_DISPLAY_OLED=1
    -DSH110X_NO_SPLASH

; Bench trial only (2026-10-06): the E-ink Sigil with GxEPD2's DEPG0213BN
; driver, which loads its own partial-refresh waveform, and partials on. If
; the panel stays crisp, make it the default; if not, flash `sigil` again.
; Not packaged for OTA: flash over USB with --upload-port.
[env:sigil-epd-bn]
extends = env:sigil
build_flags =
    ${sigil_base.build_flags}
    -DTURNHUB_EPD_PANEL_BN=1

; Wokwi simulation of the E-ink Sigil (see WOKWI.md): the same analog
; thumbstick and status ring, with a PAIR pushbutton on GPIO19 standing in
; for the DevKit's BOOT button.
[env:sigil-wokwi]
extends = sigil_base
lib_deps =
    ${sigil_base.lib_deps}
    adafruit/Adafruit NeoPixel@1.15.5
; No OTA in the simulation: the updater needs real Wi-Fi and flash slots.
build_src_filter = ${sigil_base.build_src_filter} -<sigil_updater.cpp>
build_flags =
    ${sigil_base.build_flags}
    -DTURNHUB_WOKWI
build_src_flags =
    -include wokwi_espnow_shim.h

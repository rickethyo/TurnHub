[platformio]
default_envs = sigil

; The one Sigil build. Gen 1 e-paper/OLED, spare and Wokwi builds live on the
; legacy/gen1 branch. This build keeps the radio client, pairing and secure
; link, thumbstick, status ring, buzzer, menu and updater, with the display
; behind sigil_display.h (headless until the LVGL Sigil renderer is bound);
; a sigil-s3 environment replaces it once the S3 board drivers exist.
[env:sigil]
; Pinned (2026-10-02): the code targets Arduino-ESP32 2.0.17. An unpinned
; espressif32 can resolve to a locally installed pioarduino platform (Arduino
; core 3.x, mbedTLS 3), which does not build TurnHub.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5

build_flags =
    -I../shared/include
    -DCORE_DEBUG_LEVEL=1
    ; Until an S3 Sigil product exists, refuse every OTA offer so this build
    ; can never install over, or be installed as, a Gen 1 package
    ; (firmware_package.h).
    -DTURNHUB_OTA_RETIRED=1

; The Gen 1 Atlas board (E32R28T: classic ESP32, 2.8-inch ILI9341 with an
; XPT2046 resistive touch panel) as a stand-in for the S3 Sigil: the same
; firmware with the LVGL Sigil screen (sigil_display_lvgl.cpp) and its five
; keys as on-screen buttons. huge_app (one 3 MB app slot): this build
; refuses OTA anyway, and LVGL plus the generated fonts outgrow 1.25 MB.
[env:sigil-e32r28t]
extends = env:sigil
board_build.partitions = huge_app.csv
lib_deps =
    lovyan03/LovyanGFX@1.2.30
    lvgl/lvgl@9.3.0
; The LVGL fonts generated for the simulator (LVGL/tools/generate_*fonts.py).
build_src_filter = +<*> +<../../LVGL/assets/th_eyebrow_13.c> +<../../LVGL/assets/th_semi_16.c>
    +<../../LVGL/assets/th_semi_20.c> +<../../LVGL/assets/th_bold_28.c>
    +<../../LVGL/assets/th_num_40.c> +<../../LVGL/assets/th_num_64.c>
build_flags =
    ${env:sigil.build_flags}
    -DTURNHUB_BOARD_E32R28T=1
    -DTURNHUB_SIGIL_LVGL=1
    ; LVGL finds include/lv_conf.h; the font sources include "lvgl.h".
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude

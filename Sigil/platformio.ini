[platformio]
default_envs = sigil

; The one Sigil build. Gen 1 e-paper/OLED, spare and Wokwi builds live on the
; legacy/gen1 branch. This build keeps the radio client, pairing and secure
; link, thumbstick, status ring, buzzer, menu and updater, with the display
; behind sigil_display.h (headless until the LVGL Sigil renderer is bound);
; a sigil-s3 environment replaces it once the S3 board drivers exist.
[env:sigil]
; Pinned (2026-10-02): the code targets Arduino-ESP32 2.0.17. An unpinned
; espressif32 can resolve to a locally installed pioarduino platform (Arduino
; core 3.x, mbedTLS 3), which does not build TurnHub.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5

build_flags =
    -I../shared/include
    -DCORE_DEBUG_LEVEL=1
    ; Until an S3 Sigil product exists, refuse every OTA offer so this build
    ; can never install over, or be installed as, a Gen 1 package
    ; (firmware_package.h).
    -DTURNHUB_OTA_RETIRED=1

[platformio]
default_envs = sigil

; The one Sigil build (one per real board; the old sigil-e32r28t alias is
; gone): touchscreen-only Sigil on the E32R28T stand-in. The radio, pairing,
; secure link, menu and updater are shared with the future S3 touch target.
[env:sigil]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; LVGL and fonts need the 3 MB app slot. USB flash only until S3 OTA lands.
board_build.partitions = huge_app.csv
lib_deps =
    lovyan03/LovyanGFX@1.2.30
    lvgl/lvgl@9.3.0
build_src_filter = +<*> +<../../shared/display/th_eyebrow_13.c> +<../../shared/display/th_semi_16.c>
    +<../../shared/display/th_semi_20.c> +<../../shared/display/th_bold_28.c>
    +<../../shared/display/th_num_40.c> +<../../shared/display/th_num_64.c> +<../../shared/display/th_icons.c>
build_flags =
    -I../shared/include
    -DCORE_DEBUG_LEVEL=1
    -DTURNHUB_OTA_RETIRED=1
    -DTURNHUB_BOARD_E32R28T=1
    -DTURNHUB_SIGIL_LVGL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude


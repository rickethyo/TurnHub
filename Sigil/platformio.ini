[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:sigil]
lib_deps =
    zinggjm/GxEPD2

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DSIGIL_HAS_DISPLAY=1

[env:sigil-basic]
build_src_filter =
    +<*>
    -<sigil_display.cpp>

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DSIGIL_HAS_DISPLAY=0

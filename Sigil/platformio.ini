[platformio]
default_envs = sigil

; Shared by every Sigil build; not an environment itself.
[sigil_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    zinggjm/GxEPD2

build_src_filter = +<*> -<oled_display.cpp>

build_flags =
    -I../shared/include
    -DCORE_DEBUG_LEVEL=1

; E-ink Sigil: 2.13" e-paper plus the analog thumbstick in place of the
; Pass/Action/Pause buttons (VRX GPIO34, VRY GPIO35, SW GPIO32; power the
; stick from 3.3 V), and a NeoPixel Jewel 7 RGBW status ring (Data Input
; GPIO26 via 330 ohm, PWR 5V). Owner's board is on COM13; override with
; --upload-port.
[env:sigil]
extends = sigil_base
upload_port = COM13
monitor_port = COM13
lib_deps =
    ${sigil_base.lib_deps}
    adafruit/Adafruit NeoPixel@1.15.5
build_flags =
    ${sigil_base.build_flags}
    -DTURNHUB_INPUT_JOYSTICK=1
    -DTURNHUB_STATUS_RING=1

; OLED Sigil: hardware profile (SH1106 128x64, software SPI, carrier EPD
; header pins) lives in include/oled_config.h. Buttons, not the joystick.
; Owner's board is on COM14.
[env:sigil-oled]
extends = sigil_base
upload_port = COM14
monitor_port = COM14
lib_deps =
    adafruit/Adafruit SH110X@2.1.15
build_src_filter = +<*> -<epaper_display.cpp>
build_flags =
    ${sigil_base.build_flags}
    -DTURNHUB_DISPLAY_OLED=1
    -DSH110X_NO_SPLASH

; Wokwi simulation of the e-ink Sigil (see WOKWI.md). diagram.json wires
; pushbuttons, so this build keeps button input rather than the joystick.
[env:sigil-wokwi]
extends = sigil_base
build_flags =
    ${sigil_base.build_flags}
    -DTURNHUB_WOKWI
build_src_flags =
    -include wokwi_espnow_shim.h

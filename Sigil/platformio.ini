[platformio]
default_envs = sigil

[env:sigil]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    zinggjm/GxEPD2

build_src_filter = +<*> -<oled_display.cpp>

build_flags =
    -I../shared/include
    -DCORE_DEBUG_LEVEL=1

[env:sigil-wokwi]
extends = env:sigil
build_flags =
    ${env:sigil.build_flags}
    -DTURNHUB_WOKWI
build_src_flags =
    -include wokwi_espnow_shim.h

; E-paper Sigil with an analog thumbstick (VRX GPIO34, VRY GPIO35, SW GPIO32)
; in place of the Pass/Action/Pause buttons. Power the stick from 3.3 V.
[env:sigil-joystick]
extends = env:sigil
build_flags =
    ${env:sigil.build_flags}
    -DTURNHUB_INPUT_JOYSTICK=1

; OLED hardware profile (SH1106 128x64, software SPI, carrier EPD header pins)
; lives in include/oled_config.h.
[env:sigil-oled]
extends = env:sigil
lib_deps =
    adafruit/Adafruit SH110X@2.1.15
build_src_filter = +<*> -<epaper_display.cpp>
build_flags =
    ${env:sigil.build_flags}
    -DTURNHUB_DISPLAY_OLED=1
    -DSH110X_NO_SPLASH

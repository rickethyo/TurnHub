[wokwi]
version = 1
firmware = '.pio/build/sigil-wokwi/firmware.bin'
elf = '.pio/build/sigil-wokwi/firmware.elf'

# The real Sigil's 2.13" SSD1680 panel (GDEM0213B74: 128 RAM columns, 122 visible,
